<!DOCTYPE html>
<html lang="pl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>Nocny slalom</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#071321;font-family:Arial,Helvetica,sans-serif;color:#eefaff}body{display:flex;align-items:center;justify-content:center}#frame{position:relative;width:403px;height:733px;flex:none;overflow:hidden;transform-origin:center;background:#0a1928}canvas{display:block;width:403px;height:733px}button{font:inherit;color:inherit;border:1px solid #416073;background:#142c3f;border-radius:14px;cursor:pointer;touch-action:manipulation}button:focus-visible{outline:3px solid #51f5ca;outline-offset:2px}button:active{transform:scale(.96)}header{position:absolute;top:0;left:0;width:100%;padding:22px 22px 0;pointer-events:none}.brand{font-size:10px;font-weight:700;letter-spacing:3px;color:#5cdec8}.title{font-size:26px;letter-spacing:-1px;font-weight:900;margin:7px 0 15px}.stats{display:flex;gap:28px}.label{font-size:9px;color:#9eb1c1;letter-spacing:1.5px}.value{font-size:21px;font-weight:800;margin-top:4px}#pause{position:absolute;right:22px;top:28px;width:43px;height:43px;font-size:19px}#reset{position:absolute;top:88px;right:22px;font-size:11px;padding:8px 11px;color:#b8cbd9}.controls{position:absolute;bottom:18px;width:100%;padding:0 22px;display:flex;align-items:center;justify-content:space-between}.steer{width:83px;height:58px;font-size:28px;background:#173146;border-color:#375568;touch-action:none;user-select:none}.hint{text-align:center;color:#9bb0c2;font-size:10px;line-height:1.8;letter-spacing:.5px}.hint b{color:#57e8c4;font-size:11px}#overlay{position:absolute;inset:152px 17px 106px;display:flex;align-items:center;justify-content:center;background:#0613208c;backdrop-filter:blur(5px);border-radius:18px}#overlay[hidden]{display:none}.card{text-align:center;padding:26px 19px;width:100%;border:1px solid #3f6878;border-radius:23px;background:linear-gradient(150deg,#193347f5,#0a1c2bf5);box-shadow:0 20px 70px #0008}.badge{font-size:10px;color:#5bf1c8;letter-spacing:3px}.card h1{font-size:35px;line-height:1.05;margin:15px 0}.card p{font-size:13px;color:#b9ccd9;line-height:1.8}.card button{margin-top:12px;background:#65efcb;color:#08272c;font-weight:900;border:0;padding:17px 34px;font-size:14px;letter-spacing:1px}.tiny{font-size:10px!important;color:#839cad!important}
</style></head>
<body><main id="frame" aria-label="Nocny slalom, gra samochodowa"><canvas id="game" width="806" height="1466" aria-label="Droga z przeszkodami"></canvas><header><div class="brand">ARCADE / DRIVE</div><div class="title">NOCNY SLALOM<span style="color:#65efcb">.</span></div><div class="stats"><div><div class="label">DYSTANS</div><div class="value" id="score">0 m</div></div><div><div class="label">REKORD</div><div class="value" id="best">0 m</div></div><div><div class="label">KM/H</div><div class="value" id="speed">90</div></div></div></header><button id="pause" aria-label="Pauza lub wznowienie">Ⅱ</button><button id="reset" title="Rozpocznij od nowa">↻ Od nowa</button><div class="controls"><button class="steer" id="left" aria-label="Skręć w lewo">←</button><div class="hint"><b>OMIJAJ PRZESZKODY</b><br>← → lub A / D · P — pauza</div><button class="steer" id="right" aria-label="Skręć w prawo">→</button></div><div id="overlay"><div class="card"><div class="badge" id="badge">NOCNA ZMIANA</div><h1 id="heading">Twoja droga.<br>Twój refleks.</h1><p id="message">Mijaj samochody i barierki.<br>Jedź jak najdalej bez zderzenia.</p><button id="play">JEDZIEMY →</button><p class="tiny">Steruj strzałkami, A / D lub przyciskami.</p></div></div></main>
<script>
'use strict';
const CONFIG={width:403,height:733,roadLeft:47,roadRight:356,playerY:555,baseSpeed:220,maxSpeed:465,steerSpeed:340};
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');ctx.scale(2,2);
const ui={score:document.getElementById('score'),best:document.getElementById('best'),speed:document.getElementById('speed'),overlay:document.getElementById('overlay'),heading:document.getElementById('heading'),message:document.getElementById('message'),play:document.getElementById('play'),badge:document.getElementById('badge')};
let best=0;try{best=Number(localStorage.getItem('nocny-slalom-best'))||0}catch(e){}ui.best.textContent=best+' m';
let state='ready',x=201.5,distance=0,speed=220,roadOffset=0,spawnTimer=.65,objects=[],last=0,pressed=new Set(),touch=new Set(),glow=0;
const lanes=[98.5,201.5,304.5];
function round(x,y,w,h,r,fill){ctx.fillStyle=fill;ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill()}
function car(cx,cy,color,player=false){ctx.save();ctx.translate(cx,cy);ctx.shadowBlur=14;ctx.shadowColor=player?'#50f9c875':'#0008';round(-25,-45,50,90,12,'#050d17');ctx.shadowBlur=0;round(-28,-28,7,21,3,'#02080e');round(21,-28,7,21,3,'#02080e');round(-28,18,7,21,3,'#02080e');round(21,18,7,21,3,'#02080e');const g=ctx.createLinearGradient(-23,0,23,0);g.addColorStop(0,color);g.addColorStop(.5,player?'#a3ffe0':'#ebf1fc');g.addColorStop(1,color);round(-23,-45,46,90,10,g);round(-18,-18,36,28,6,'#122c40');round(-16,-14,32,5,2,'#376179');round(-16,27,32,10,3,'#163247');round(-17,-39,10,5,2,'#f3ffdb');round(7,-39,10,5,2,'#f3ffdb');round(-18,39,9,4,1,'#ff4a76');round(9,39,9,4,1,'#ff4a76');ctx.fillStyle='#ffffff3a';ctx.fillRect(-19,-29,2,52);ctx.fillRect(17,-29,2,52);if(player){ctx.fillStyle='#081f2b';ctx.fillRect(-5,-41,3,18);ctx.fillRect(2,-41,3,18)}ctx.restore()}
function barrier(cx,cy){ctx.save();ctx.translate(cx,cy);round(-33,-18,66,36,5,'#111d2a');round(-32,-17,64,25,4,'#f6a94c');ctx.save();ctx.beginPath();ctx.rect(-31,-16,62,23);ctx.clip();ctx.fillStyle='#512c24';for(let i=-50;i<40;i+=20){ctx.beginPath();ctx.moveTo(i,-16);ctx.lineTo(i+11,-16);ctx.lineTo(i+31,7);ctx.lineTo(i+20,7);ctx.fill()}ctx.restore();round(-24,9,6,14,2,'#c2c4bd');round(18,9,6,14,2,'#c2c4bd');ctx.restore()}
function draw(){ctx.fillStyle='#0a1928';ctx.fillRect(0,0,403,733);ctx.save();ctx.beginPath();ctx.rect(0,148,403,491);ctx.clip();ctx.fillStyle='#102c32';ctx.fillRect(0,148,403,491);for(let side of [0,1])for(let i=0;i<11;i++){const y=148+((i*77+roadOffset*.66)%650)-60,cx=side?389:14;round(cx-10,y,20,33,7,'#163c3c');round(cx-6,y+3,12,22,5,'#1b4942')}
ctx.fillStyle='#253443';ctx.fillRect(47,148,309,491);ctx.fillStyle='#1e2e3d';ctx.fillRect(55,148,293,491);
for(let i=0;i<17;i++){const y=148+((i*42+roadOffset)%714)-42;ctx.fillStyle=i%2?'#f5d78a':'#d26558';ctx.fillRect(40,y,7,37);ctx.fillRect(356,y,7,37)}ctx.fillStyle='#9cb5c1';ctx.fillRect(55,148,2,491);ctx.fillRect(346,148,2,491);
ctx.fillStyle='#8293a273';for(let i=0;i<10;i++){let y=148+((i*87+roadOffset)%870)-87;ctx.fillRect(149,y,3,43);ctx.fillRect(252,y,3,43)}
for(const ob of objects){if(ob.type==='barrier')barrier(ob.x,ob.y);else car(ob.x,ob.y,ob.color)}
if(state==='ready'){car(lanes[0],290,'#e39056');barrier(lanes[2],390);car(lanes[1],180,'#7d8fe7')}
const beam=ctx.createLinearGradient(0,CONFIG.playerY-160,0,CONFIG.playerY-40);beam.addColorStop(0,'#9cffd400');beam.addColorStop(1,'#9cffd41c');ctx.fillStyle=beam;ctx.beginPath();ctx.moveTo(x-19,CONFIG.playerY-40);ctx.lineTo(x-47,CONFIG.playerY-162);ctx.lineTo(x+47,CONFIG.playerY-162);ctx.lineTo(x+19,CONFIG.playerY-40);ctx.fill();car(x,CONFIG.playerY,'#35cfa3',true);
if(glow>0){ctx.fillStyle='#ff67675c';ctx.fillRect(0,148,403,491)}ctx.restore();const fade=ctx.createLinearGradient(0,148,0,180);fade.addColorStop(0,'#0a1928');fade.addColorStop(1,'#0a192800');ctx.fillStyle=fade;ctx.fillRect(0,148,403,32);ctx.fillStyle='#0a1928';ctx.fillRect(0,639,403,94);ctx.fillStyle='#284454';ctx.fillRect(22,640,359,1)}
function hud(){ui.score.textContent=Math.floor(distance)+' m';ui.speed.textContent=Math.round(speed*.41);ui.best.textContent=best+' m'}
function saveBest(){if(Math.floor(distance)>best){best=Math.floor(distance);try{localStorage.setItem('nocny-slalom-best',best)}catch(e){}}}
function start(){saveBest();state='running';x=201.5;distance=0;speed=220;objects=[];spawnTimer=.7;roadOffset=0;pressed.clear();touch.clear();glow=0;ui.overlay.hidden=true;document.getElementById('pause').textContent='Ⅱ';hud()}
function show(badge,heading,message,button){ui.badge.textContent=badge;ui.heading.innerHTML=heading;ui.message.innerHTML=message;ui.play.textContent=button;ui.overlay.hidden=false}
function pause(){if(state==='running'){state='paused';pressed.clear();touch.clear();show('ODDECH','Chwila przerwy','Droga poczeka.<br>Wróć, kiedy będziesz gotowy.','WRACAM →');document.getElementById('pause').textContent='▶'}else if(state==='paused'){state='running';ui.overlay.hidden=true;document.getElementById('pause').textContent='Ⅱ'}}
function gameOver(){state='over';glow=.3;saveBest();hud();show('KONIEC JAZDY','Jeszcze raz?','Dystans: <b>'+Math.floor(distance)+' m</b><br>Twój rekord: <b>'+best+' m</b>','SPRÓBUJ PONOWNIE →')}
function update(dt){if(state!=='running')return;speed=Math.min(CONFIG.maxSpeed,CONFIG.baseSpeed+distance*.13);distance+=speed*dt/12;roadOffset=(roadOffset+speed*dt)%6090;
const direction=(pressed.has('ArrowRight')||pressed.has('d')||touch.has('right')?1:0)-(pressed.has('ArrowLeft')||pressed.has('a')||touch.has('left')?1:0);x=Math.max(80,Math.min(323,x+direction*CONFIG.steerSpeed*dt));
spawnTimer-=dt;if(spawnTimer<=0){const lane=Math.floor(Math.random()*3);objects.push({x:lanes[lane],y:95,type:Math.random()<.29?'barrier':'car',color:['#e18b56','#7f8fe8','#db647c','#e1c969'][Math.floor(Math.random()*4)]});spawnTimer= Math.max(.85,1.5-distance/1900)+Math.random()*.25}
for(const ob of objects){ob.y+=speed*dt;const hw=ob.type==='car'?21:31,hh=ob.type==='car'?40:20;if(Math.abs(ob.x-x)<hw+19&&Math.abs(ob.y-CONFIG.playerY)<hh+37){gameOver();break}}objects=objects.filter(ob=>ob.y<710);hud()}
function loop(t){const dt=Math.min((t-last)/1000,.035)||0;last=t;update(dt);glow=Math.max(0,glow-dt);draw();requestAnimationFrame(loop)}
ui.play.onclick=()=>state==='paused'?pause():start();document.getElementById('pause').onclick=pause;document.getElementById('reset').onclick=start;
window.addEventListener('keydown',e=>{const k=e.key.length===1?e.key.toLowerCase():e.key;if(['ArrowLeft','ArrowRight','a','d',' ','p','Escape'].includes(k)){e.preventDefault();if(e.repeat&&[' ','p','Escape'].includes(k))return;if(k==='p'||k==='Escape')pause();else if(k===' '){if(state==='ready'||state==='over')start();else pause()}else pressed.add(k)}});window.addEventListener('keyup',e=>pressed.delete(e.key.length===1?e.key.toLowerCase():e.key));
for(const id of ['left','right']){const b=document.getElementById(id);b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture(e.pointerId);touch.add(id)});for(const event of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(event,()=>touch.delete(id))}
window.addEventListener('blur',()=>{pressed.clear();touch.clear();if(state==='running')pause()});document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='running')pause()});
function resize(){const scale=Math.min(1,innerWidth/403,innerHeight/733);const frame=document.getElementById('frame');frame.style.transform='scale('+scale+')'}window.addEventListener('resize',resize);resize();hud();requestAnimationFrame(loop);
</script></body></html>
